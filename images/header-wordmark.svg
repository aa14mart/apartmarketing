<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 192" role="img" aria-labelledby="title desc">
  <title id="title">APART MARKETING</title>
  <desc id="desc">APART MARKETING wordmark with camera tripod forming the first A</desc>

  <g fill="none" stroke="#E8CCA6" stroke-linecap="round" stroke-linejoin="round">
    <!-- camera -->
    <rect x="18" y="12" width="58" height="38" rx="5" stroke-width="7"/>
    <path d="M32 12l5-8h20l5 8" stroke-width="7"/>
    <circle cx="47" cy="31" r="11" stroke-width="6"/>

    <!-- tripod / first A -->
    <path d="M47 50 L12 124" stroke-width="7"/>
    <path d="M47 50 L82 124" stroke-width="7"/>
    <path d="M47 50 L47 124" stroke-width="6"/>
    <path d="M27 92 H67" stroke-width="6"/>
  </g>

  <!-- APART -->
  <g fill="#E8CCA6" font-family="Arial, Helvetica, sans-serif">
    <text x="91" y="124" font-size="104" font-weight="300" letter-spacing="4">PART</text>

    <!-- MARKETING -->
    <text x="34" y="171" font-size="37" font-weight="600" letter-spacing="13">MARKETING</text>
  </g>
</svg>
