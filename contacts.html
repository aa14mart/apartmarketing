  <script src="contact-rules.js?v=185" defer></script>
  <script src="contact-form.js?v=187" defer></script>
</head>
<body>

<main class="site-shell">
<section class="panel header-panel--logo-home">
      <nav class="header-nav" aria-label="Навигация">
        <a class="header-home-logo" href="index.html" aria-label="Главная">
              <img src="images/header-wordmark.svg?v=200" alt="APART MARKETING">
            </a>
            <button class="mobile-menu-toggle"
                    type="button"
                    aria-label="Открыть меню"
                    aria-controls="mobile-site-menu"
                    aria-expanded="false">
              <span aria-hidden="true"></span>
              <span aria-hidden="true"></span>
              <span aria-hidden="true"></span>
            </button>
            <a  href="services.html" data-i18n="services_btn">УСЛУГИ</a>
            <a  href="about.html" data-i18n="about_btn">ПРО НАС</a>
            <a  href="gallery.html" data-i18n="gallery_btn">ГАЛЕРЕЯ</a>
            <a class="is-active" href="contacts.html" data-i18n="contacts_btn">КОНТАКТЫ</a>
      </nav>
<div class="header-single-right">

        <span class="header-location" aria-label="Location: Batumi">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 10.2A3.2 3.2 0 1 1 12 5.8a3.2 3.2 0 0 1 0 6.4z"/>
          </svg>
          <span>Batumi</span>
        </span>

        <div class="language-switcher" aria-label="Переключение языка">
          <button class="language-btn is-active" type="button" data-lang="ru">RU</button>
          <button class="language-btn" type="button" data-lang="en">EN</button>
          <button class="language-btn" type="button" data-lang="ka">GE</button>
        </div>
      </div>
</section>

    <nav class="panel mobile-site-menu" id="mobile-site-menu" aria-label="Мобильное меню">
          <a class="mobile-menu__link" href="services.html" data-i18n="services_btn">УСЛУГИ</a>
          <a class="mobile-menu__link" href="about.html" data-i18n="about_btn">ПРО НАС</a>
          <a class="mobile-menu__link" href="gallery.html" data-i18n="gallery_btn">ГАЛЕРЕЯ</a>
          <a class="mobile-menu__link is-active" href="contacts.html" data-i18n="contacts_btn">КОНТАКТЫ</a>
        </nav>

    <section class="panel content-panel info-page">
      <h1 class="info-page__title" data-i18n="contacts_title">КОНТАКТЫ</h1>
      <p class="contacts-page__intro" data-i18n="contacts_intro">Свяжитесь с нами удобным способом.</p>

      <div class="contacts-list">
        <a class="contact-row" href="tel:+995511444840">
          <span class="contact-row__label" data-i18n="contacts_phone_label">ТЕЛЕФОН</span>
          <span class="contact-row__value">+995 511 444 840</span>
        </a>

        <a class="contact-row" href="https://t.me/apartmarketing" target="_blank" rel="noopener noreferrer">
          <span class="contact-row__label">TELEGRAM</span>
          <span class="contact-row__value">@apartmarketing</span>
        </a>

        <a class="contact-row" href="https://wa.me/995511444840" target="_blank" rel="noopener noreferrer">
          <span class="contact-row__label">WHATSAPP</span>
          <span class="contact-row__value">+995 511 444 840</span>
        </a>

        <a class="contact-row" href="https://instagram.com/apartmarketing" target="_blank" rel="noopener noreferrer">
          <span class="contact-row__label">INSTAGRAM</span>
          <span class="contact-row__value">@apartmarketing</span>
        </a>

        <div class="contact-row">
          <span class="contact-row__label" data-i18n="contacts_location_label">ЛОКАЦИЯ</span>
          <span class="contact-row__value">Batumi, Georgia</span>
        </div>
      </div>

      <form class="contact-form" id="contact-form" novalidate>
        <fieldset class="contact-form__body">
          <label class="contact-form__name"><span class="visually-hidden" data-form-text="name">Ваше имя</span>
            <input id="lead-name" name="name" autocomplete="name" required maxlength="100" placeholder="Ваше имя (обязательно)" aria-describedby="name-error">
          </label>
          <p id="name-error" class="field-error" hidden></p>
          <label><span class="visually-hidden" data-form-text="method">Способ связи (обязательно)</span>
            <select name="method" id="lead-method" required aria-describedby="method-error">
              <option value="" selected disabled hidden data-form-text="method">Способ связи (обязательно)</option>
              <option value="call" data-form-text="call">Позвоните мне</option>
              <option value="whatsapp">WhatsApp</option><option value="telegram">Telegram</option>
              <option value="instagram">Instagram</option><option value="messenger">Facebook Messenger</option><option value="viber">Viber</option><option value="email">E-mail</option>
            </select>
          </label>
          <p id="method-error" class="field-error" hidden></p>
          <div class="contact-form__contact" hidden>
            <label for="lead-contact" class="contact-form__contact-label visually-hidden"></label>
            <div class="contact-form__contact-row">
              <span class="contact-form__prefix" aria-hidden="true"></span>
              <select name="country" id="lead-country" hidden></select>
              <input name="contact" id="lead-contact" disabled aria-describedby="contact-error" maxlength="250">
            </div>
            
            <p id="contact-error" class="field-error" hidden></p>
          </div>
          <div class="contact-form__message-block">
            <div class="contact-form__message-input">
              <label for="lead-message" class="visually-hidden" data-form-text="message"></label>
              <span id="message-count">0/500</span>
              <textarea id="lead-message" name="message" rows="5" maxlength="500" aria-describedby="message-count" placeholder="Опишите задачу или задайте вопрос (необязательно)"></textarea>
            </div>
            <div class="contact-form__upload">
              <span data-form-text="photos"></span>
              <label class="contact-form__upload-button">
                <span data-form-text="uploadButton">ЗАГРУЗИТЬ</span>
                <input type="file" name="photos" multiple aria-label="ЗАГРУЗИТЬ">
              </label>
            </div>
            <p class="contact-form__file-errors field-error" role="status" hidden></p>
            <ul class="contact-form__files" aria-live="polite"></ul>
          </div>
          <div class="contact-form__trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
        </fieldset>
        <button type="submit" data-form-text="submit">ОТПРАВИТЬ</button>
        <p class="contact-form__status" role="status" aria-live="polite" aria-atomic="true"></p>
        <noscript>Для отправки формы включите JavaScript или свяжитесь с нами по контактам выше.</noscript>
      </form>
    </section>

    <footer class="site-footer">
  <div class="site-footer__content">

  <a href="services.html" data-i18n="services_btn">УСЛУГИ</a>
